name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: cloudflare
            site: https://bernardosevero.dev
            base: /
          - target: github-compatibility
            site: https://bernardosevero.github.io
            base: /bernardosevero.dev
    env:
      SITE_URL: ${{ matrix.site }}
      BASE_PATH: ${{ matrix.base }}
      # Public client values, so repository variables rather than secrets.
      PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
      PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Production silently loses analytics without these, so fail before building.
      - name: Require analytics settings for production
        if: matrix.target == 'cloudflare' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$PUBLIC_POSTHOG_KEY" ] || [ -z "$PUBLIC_POSTHOG_HOST" ]; then
            echo "::error::Set the PUBLIC_POSTHOG_KEY and PUBLIC_POSTHOG_HOST repository variables."
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:css
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      # The Worker reads this build's snapshot at runtime; fail here if they have drifted apart.
      - name: Check the snapshot against the MCP Worker's schema
        run: |
          npm ci --prefix mcp
          npm run check:snapshot --prefix mcp -- ../dist/api/v1/content.json
      # Playwright builds before testing. Publish that exact verified output.
      - name: Upload verified site
        if: matrix.target == 'cloudflare' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-site
          path: dist
          retention-days: 7

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    needs: [build, mcp]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://bernardosevero.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-site
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy verified site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bernardosevero-dev --branch=main

  # Runs after the site deploy, so the snapshot the Worker fetches is already live.
  # Stays off until the MCP_DEPLOY_ENABLED repository variable is 'true': the API token
  # needs Workers and DNS permissions first (docs/deployment.md).
  deploy-mcp:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.MCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-mcp
      url: https://mcp.bernardosevero.dev/mcp
    defaults:
      run:
        working-directory: mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Public client values, shared with the site's analytics.
      POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
      POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Deploy the MCP Worker
        run: npx wrangler deploy --var "POSTHOG_KEY:$POSTHOG_KEY" --var "POSTHOG_HOST:$POSTHOG_HOST"
