[config.site]
title = "bernardosevero.dev"
description = "A personal website built with Astro."
pageTitle = "navfolio | Digital Publication Space"
pageDescription = "A calm AI-native personal publication space for notes, links, and writing."
url = "https://astro.navfolio.site"
repository = "https://github.com/bernardosevero/bernardosevero.dev"
footerNote = "Released as an open-source starter."

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# Native UI language. Allowed values: en, zh-CN, zh-TW. Unknown values fall back to en.
lang = "en"

[config.fonts]
# English and code-oriented UI font
en = "Maple Mono"
code = "Monaco"
# Directly selectable in the template: ChillRoundM, LXGW WenKai
# Chinese reading font
zh = "ChillRoundM"
# Full Chinese font file
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "Writing notes"
kicker = "Notebook archive"
subtitle = "Notes from the margins."
note = "Field notes, drafts, and technical margins arranged for slow browsing."
postsPerPage = 6
# Date format template used by date-fns.
dateFormat = "yyyy-MM-dd"
# Metadata separator. You can use symbols such as "|" or "/", or the special value "icon".
metadataSeparator = "icon"
# Article list cover style: "card" keeps a bordered thumbnail, "mask" blends the image into the right side.
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "Small tools and site systems."
note = "A compact shelf for implementation choices, releases, and publishing experiments."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "Life and coding fragments."
note = "Not formal enough for blog posts, but still part of the story."
showTrail = true

[config.pages.media]
title = "Media"
subtitle = "Works read, watched, and listened to, plus a bit of how they felt at the time."
note = "One page for browsing books, films, series, albums, and podcasts."

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "bernardosevero"
handle = "@bernardosevero_"
role = "Product Engineer"
email = "bernardoseverosilveira@gmail.com"
website = "https://astro.navfolio.site/"
github = "https://github.com/bernardosevero"
